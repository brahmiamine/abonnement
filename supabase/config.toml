# Configuration Supabase CLI (supabase start / supabase config push).
# Reprend les réglages de sécurité attendus par Subly : à reporter dans le tableau de bord
# (Authentication > Providers / Rate Limits) si vous n'utilisez pas la CLI.

project_id = "subly"

[auth]
site_url = "https://brahmiamine.github.io/abonnement/"
additional_redirect_urls = ["https://brahmiamine.github.io/abonnement/", "http://localhost:5173/abonnement/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Évite les comptes fantômes et la prise de contrôle d'une adresse e-mail non vérifiée.
enable_confirmations = true
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# Un lien magique ne peut être redemandé qu'une fois par minute.
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[functions.send-reminders]
# Authentification par secret partagé (x-cron-secret) : pas de JWT pour pg_cron.
verify_jwt = false
